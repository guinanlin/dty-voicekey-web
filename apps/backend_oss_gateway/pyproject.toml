[project]
name = "backend-oss-gateway"
version = "0.1.0"
description = "China Cloud Storage Gateway template for nextjs-fastapi-template monorepo"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "asyncpg>=0.29.0,<0.30",
    "pydantic-settings>=2.5.2,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "httpx>=0.27.0,<0.28",
    "boto3>=1.35.0,<2",
    "oss2>=2.18.0,<3",
    "python-multipart>=0.0.9,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-mock>=3.14.0,<4",
    "aiosqlite>=0.20.0,<0.21",
    "alembic>=1.14.0,<2",
    "python-dotenv>=1.0.1,<2",
    "ruff>=0.1.0,<0.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
