services:
  backend:
    build:
      context: ../apps/backend
    environment:
      - OPENAPI_OUTPUT_FILE=./shared-data/openapi.json
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@db_test:5432/testdatabase
      - REDIS_URL=redis://redis:6379/0
      - MAIL_SERVER=mailhog
      - ACCESS_SECRET_KEY=dev-access-secret-change-in-production
      - RESET_PASSWORD_SECRET_KEY=dev-reset-secret-change-in-production
      - VERIFICATION_SECRET_KEY=dev-verification-secret-change-in-production
      - CORS_ORIGINS=["*"]
      - RELAY_PUBLIC_WS_URL=ws://localhost:8600/ws
      - RELAY_REQUIRE_WSS=false
    ports:
      - "8600:8000"
    networks:
      - my_network
    volumes:
      - ../apps/backend:/app
      - backend-venv:/app/.venv
      - ../shared-data:/app/shared-data
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - my_network
    volumes:
      - redis_data:/data
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5600:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdatabase
    ports:
      - "5610:5432"
    networks:
      - my_network
    restart: always
  frontend:
    build:
      context: ../apps/frontend
    user: bun
    ports:
      - "3600:3000"
    networks:
      - my_network
    environment:
      NODE_ENV: development
      API_BASE_URL: http://backend:8000
      OPENAPI_OUTPUT_FILE: ./shared-data/openapi.json
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../apps/frontend:/app
      - frontend-node-modules:/app/node_modules
      - ../shared-data:/app/shared-data
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8630:1025" # SMTP server
      - "8650:8025" # Web UI
    networks:
      - my_network

volumes:
  postgres_data:
  redis_data:
  frontend-node-modules:
  backend-venv:

networks:
  my_network:
    driver: bridge
