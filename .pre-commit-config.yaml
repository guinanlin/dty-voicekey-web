fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: >
          (?x)^(
              package-lock\.json
          )$
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.1.8
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: run frontend lint
        entry: sh -c 'cd apps/frontend && bun run lint'
        language: system
        types: [ file ]
        files: ^apps/frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true
      - id: frontend-prettier
        name: Run Prettier on frontend files
        entry: sh -c 'cd apps/frontend && bun run prettier'
        language: system
        types: [ file ]
        files: ^apps/frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true
      - id: frontend-tsc
        name: run frontend tsc
        entry: sh -c 'cd apps/frontend && bun run tsc'
        language: system
        types: [ file ]
        files: ^apps/frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: sync-openapi-client
        name: sync OpenAPI schema and frontend client
        entry: bash scripts/sync-openapi-client.sh
        language: system
        files: (apps/backend/app/main\.py$|apps/backend/app/schemas\.py$|apps/backend/pyproject\.toml|apps/frontend/openapi\.json$)
        pass_filenames: false
        # export requirements is required to vercel deploy
      - id: export-requirements
        name: Export requirements.txt
        entry: sh -c 'cd apps/backend && uv export > requirements.txt'
        language: system
        files: uv.lock  # Trigger when uv.lock is modified
        pass_filenames: false