# Monorepo workspace root (uv). Run `uv sync` from repo root or any member.
[project]
name = "nextjs-fastapi-template"
version = "0.0.0"
description = "Monorepo workspace root"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend", "packages/py/*"]
